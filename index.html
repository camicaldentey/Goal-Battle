<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1424"><title>GOAL BATTLE</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f7fafc;background:#091321}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-size:27px;font-weight:950;letter-spacing:-1.5px}.brand b{color:#a2fb62}small,.muted{color:#a5b4c8}h1{font-size:34px;line-height:1.05;margin:8px 0 12px}h2{font-size:23px}p{line-height:1.5}.hero{padding:24px;border-radius:23px;background:linear-gradient(130deg,#1d3950,#101d32 60%,#294036);margin-bottom:20px}.card{background:#14243a;border:1px solid #2a4055;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{text-align:center;background:#1b3149;border-radius:15px;padding:18px 9px}.avatar{font-size:35px}.score{font-size:40px;color:#a2fb62;font-weight:900}.score.other{color:#f4b26d}.btn{background:#a2fb62;color:#0c1726;border:0;border-radius:12px;padding:14px 18px;font-weight:850;cursor:pointer;font-size:15px;width:100%;margin-top:9px}.btn.secondary{background:#253b51;color:#f7fafc;border:1px solid #3d566a}.btn.warn{background:#ffc18b;color:#111}.btn:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;background:#0c1a2b;border:1px solid #38516a;border-radius:11px;color:white;padding:13px;font-size:16px;margin:6px 0 15px}label{display:block;color:#d4dfed;font-size:14px;font-weight:700}.tag{display:inline-block;border-radius:20px;background:#294538;color:#a2fb62;padding:5px 11px;font-size:12px;font-weight:800}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row>*{min-width:0}.row .btn{width:auto}.hidden{display:none}.line{height:9px;background:#3c4c5c;border-radius:20px;overflow:hidden;display:flex;margin:15px 0}.line i{background:#a2fb62}.line em{background:#f4b26d;flex:1}.entry{border-top:1px solid #314459;padding:13px 0}.error{color:#ffb6aa}.success{color:#a2fb62}.pill{font-size:12px;background:#243c53;padding:5px 9px;border-radius:20px}footer{text-align:center;margin-top:32px;font-size:12px;color:#8093a9}@media(max-width:420px){.brand{font-size:23px}h1{font-size:29px}}
</style></head><body><main><header><div class="brand">GOAL <b>BATTLE</b> ⚡</div><span class="tag">FREE TO PLAY</span></header><div id="app"></div><footer>⚽ Tu rivalidad. Tus reglas. · Versión inicial de prueba</footer></main><script>
const KEY='goalbattle_demo_v1';let rooms=JSON.parse(localStorage.getItem(KEY)||'{}');let room=null,me=null,screen='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(rooms));const btn=(label,fn,cl='')=>`<button class="btn ${cl}" onclick="${fn}">${label}</button>`;function nav(s){screen=s;render()}function current(){return rooms[room]}function other(){return 1-me}function pts(type,pos,n){return n*(type==='official'?3:1)*[1,1.5,2,3][pos]}function summary(r){let points=[0,0],goals=[0,0];for(let e of r.entries||[]){if(e.status==='approved'){points[e.target]+=e.delta*pts(e.type,e.position,e.count);goals[e.target]+=e.delta*e.count}}return{points,goals}}function render(){let h='';if(screen==='home'){h=`<section class="hero"><small>FOOTBALL CHALLENGES</small><h1>Compite. Marca.<br><span style="color:#a2fb62">Haz historia.</span></h1><p>Retos de fútbol para amigas y amigos. Suma puntos, crea apuestas y gana tu rivalidad.</p></section><div class="card"><h2>Entrar a un reto</h2><label>Código de sala</label><input id="joincode" placeholder="Ej. CAMI-JOSE" maxlength="32">${btn('Entrar con código','join()')}</div>${btn('＋ Crear nuevo reto','nav("create")','secondary')}<p class="muted">No necesitas cuenta ni descargar nada.</p>`}else if(screen==='create'){h=`<h1>Crear nuevo reto</h1><div class="card"><label>Nombre del reto</label><input id="title" placeholder="Cami vs. José"><label>Nombre del jugador 1</label><input id="p1" placeholder="Cami"><label>Nombre del jugador 2</label><input id="p2" placeholder="José"><label>Código personalizado (mínimo 5 caracteres)</label><input id="code" placeholder="CAMI-JOSE2026"><label>¿Cómo se gana?</label><select id="mode" onchange="$('#targetbox').classList.toggle('hidden',this.value!=='target')"><option value="target">Primero en alcanzar puntos</option><option value="season">Más puntos al final de temporada</option></select><div id="targetbox"><label>Meta de puntos</label><input id="target" type="number" min="1" value="100"></div><label>Fecha de fin de temporada (opcional)</label><input id="end" type="date"><label>Apuesta / premio (opcional)</label><input id="bet" placeholder="El perdedor invita a comer 🍔">${btn('Crear sala','createRoom()')}</div>${btn('Volver','nav("home")','secondary')}`}else if(screen==='choose'){let r=current();h=`<div class="card"><span class="tag">SALA ENCONTRADA</span><h1>${esc(r.title)}</h1><p>¿Quién eres?</p><div class="grid">${r.players.map((p,i)=>`<button class="btn secondary" onclick="choose(${i})"><div class="avatar">${i?'🧑🏽‍🦱':'👩🏽‍🦱'}</div>${esc(p)}</button>`).join('')}</div></div>${btn('Cambiar código','nav("home")','secondary')}`}else if(screen==='room'){let r=current(),s=summary(r),total=s.points[0]+s.points[1],progress=total?100*s.points[0]/total:50;let pending=r.entries.filter(e=>e.status==='pending'&&e.author!==me);let own=r.entries.filter(e=>e.status==='pending'&&e.author===me);h=`<div class="row"><div><small>RETO ACTIVO · ${esc(r.code)}</small><h1>${esc(r.title)}</h1></div><span class="tag">⚡ LIVE*</span></div><div class="grid">${r.players.map((p,i)=>`<div class="player"><div class="avatar">${i?'🧑🏽‍🦱':'👩🏽‍🦱'}</div><b>${esc(p)}</b><div class="score ${i?'other':''}">${s.points[i]}</div><small>PUNTOS</small><p>${s.goals[i]} goles reales</p></div>`).join('')}</div><div class="line"><i style="width:${progress}%"></i><em></em></div><div class="card"><div class="row"><b>🏆 La apuesta</b><span class="pill">${r.mode==='target'?`Primero a ${r.target} puntos`:'Fin de temporada'}</span></div><p>${esc(r.bet||'Sin premio definido')}</p>${r.end?`<small>Fecha de fin: ${esc(r.end)}</small>`:''}<p class="success">${s.points[0]===s.points[1]?'¡Empate por ahora!':`${esc(r.players[s.points[0]>s.points[1]?0:1])} va ganando`}</p></div>${btn('⚽ Registrar goles','nav("register")')}<div class="card"><h2>🔔 Solicitudes para ti (${pending.length})</h2>${pending.length?pending.map(e=>`<div class="entry"><b>${esc(r.players[e.author])}</b> solicita ${e.delta===1?'añadir':'quitar'} ${e.count} gol(es) a <b>${esc(r.players[e.target])}</b><p class="muted">${e.type==='official'?'Partido oficial':'Entrenamiento'} · ${['Delantero/a','Mediocampista','Defensa','Portero/a'][e.position]} · ${e.delta*pts(e.type,e.position,e.count)} puntos</p><div class="grid">${btn('Confirmar',`decide('${e.id}','approved')`)}${btn('Pedir corrección',`decide('${e.id}','correction')`,'warn')}</div></div>`).join(''):'<p class="muted">No tienes solicitudes pendientes.</p>'}</div><div class="card"><h2>Solicitudes enviadas (${own.length})</h2>${own.length?own.map(e=>`<p>⏳ ${e.count} gol(es) para ${esc(r.players[e.target])} · esperando confirmación</p>`).join(''):'<p class="muted">Ninguna pendiente.</p>'}</div>${btn('Ver historial','nav("history")','secondary')}${btn('Cambiar jugador','nav("choose")','secondary')}${btn('Cambiar de reto','nav("home")','secondary')}`}else if(screen==='register'){let r=current();h=`<h1>Registrar goles</h1><div class="card"><label>¿A quién corresponden los goles?</label><select id="target">${r.players.map((p,i)=>`<option value="${i}">${esc(p)}</option>`).join('')}</select><label>Acción</label><select id="delta"><option value="1">Añadir goles</option><option value="-1">Quitar goles</option></select><label>Tipo de partido</label><select id="type"><option value="training">Partidito de entrenamiento</option><option value="official">Partido oficial</option></select><label>Posición en ese partido</label><select id="position"><option value="0">Delantero/a (×1)</option><option value="1">Mediocampista (×1.5)</option><option value="2">Defensa (×2)</option><option value="3">Portero/a (×3)</option></select><label>Cantidad de goles</label><input id="count" type="number" min="1" max="1000" value="1"><label>Nota opcional</label><input id="note" placeholder="Ej. Partido del miércoles">${btn('Enviar solicitud','submitEntry()')}</div>${btn('Volver al reto','nav("room")','secondary')}`}else if(screen==='history'){let r=current();h=`<h1>Historial</h1><div class="card">${r.entries.length?r.entries.slice().reverse().map(e=>`<div class="entry"><b>${esc(r.players[e.author])}</b> solicitó ${e.delta===1?'añadir':'quitar'} ${e.count} gol(es) a ${esc(r.players[e.target])}<p class="muted">${e.type==='official'?'Oficial':'Entrenamiento'} · ${['Delantero/a','Mediocampista','Defensa','Portero/a'][e.position]} · ${e.delta*pts(e.type,e.position,e.count)} puntos</p><span class="pill">${e.status==='approved'?'✓ Confirmado':e.status==='pending'?'⏳ Pendiente':'✏️ Corrección solicitada'}</span>${e.status==='correction'&&e.author===me?btn('Corregir y reenviar',`correct('${e.id}')`,'secondary'):''}</div>`).join(''):'<p>No hay registros todavía.</p>'}</div>${btn('Volver','nav("room")','secondary')}`}$('#app').innerHTML=h}function join(){let code=$('#joincode').value.trim().toUpperCase();if(!rooms[code])return alert('No encontramos ese código en este navegador. La sincronización entre dispositivos se activará en la siguiente etapa.');room=code;nav('choose')}function createRoom(){let a=$('#p1').value.trim(),b=$('#p2').value.trim(),code=$('#code').value.trim().toUpperCase(),title=$('#title').value.trim(),mode=$('#mode').value,target=Number($('#target')?.value||100);if(!a||!b||!title||code.length<5||!(/^[A-Z0-9-]+$/).test(code))return alert('Completa los nombres, título y código (letras, números o guiones; mínimo 5 caracteres).');if(rooms[code])return alert('Ese código ya existe en este navegador.');if(mode==='target'&&(!Number.isFinite(target)||target<=0))return alert('Escribe una meta válida.');rooms[code]={code,title,players:[a,b],mode,target,end:$('#end').value,bet:$('#bet').value,entries:[]};save();room=code;nav('choose')}function choose(i){me=i;nav('room')}function submitEntry(){let n=Number($('#count').value),target=Number($('#target').value),position=Number($('#position').value),type=$('#type').value,delta=Number($('#delta').value);if(!Number.isInteger(n)||n<1||n>1000)return alert('Escribe una cantidad válida de goles.');current().entries.push({id:String(Date.now())+Math.random().toString(36).slice(2),author:me,target,position,type,delta,count:n,note:$('#note').value,status:'pending',at:new Date().toISOString()});save();alert('Solicitud creada. Para probar la confirmación, cambia de jugador en esta misma sala.');nav('room')}function decide(id,status){let e=current().entries.find(x=>x.id===id);if(!e||e.author===me||e.status!=='pending')return;e.status=status;save();nav('room')}function correct(id){let e=current().entries.find(x=>x.id===id);if(!e||e.author!==me||e.status!=='correction')return;let n=Number(prompt('¿Cuántos goles fueron realmente?',e.count));if(!Number.isInteger(n)||n<1)return;e.count=n;e.status='pending';save();nav('history')}render();
</script></body></html>
